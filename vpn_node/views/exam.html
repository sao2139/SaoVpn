<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GATEKEEPER | Clau Network</title>
    <!-- Elegant Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050507;
            --bg-mid: #0a0a0e;
            --accent-red: #d32f2f;
            --accent-glow: #ff4d4d;
            --text-main: #e0e0e0;
            --text-muted: #888890;
            --glass-bg: rgba(15, 15, 18, 0.75);
            --glass-border: rgba(211, 47, 47, 0.3);
            --focus-glow: rgba(255, 77, 77, 0.3);
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-mid) 0%, var(--bg-deep) 100%);
            color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif; 
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; 
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(211, 47, 47, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(211, 47, 47, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .exam-box { 
            padding: 40px 50px; 
            text-align: center; 
            width: 420px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); 
            border-top: 2px solid var(--accent-red);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(211, 47, 47, 0.1);
            border-radius: 4px;
        }

        h1 { 
            font-family: 'Share Tech Mono', monospace; 
            color: var(--text-main);
            font-size: 1.8em; 
            letter-spacing: 2px; 
            margin-top: 0; 
            margin-bottom: 5px; 
            text-transform: uppercase;
        }

        p.subtitle { 
            color: var(--text-muted); 
            font-size: 0.9em; 
            margin-bottom: 30px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        input { 
            background: rgba(0,0,0,0.3); 
            border: none; 
            border-bottom: 1px solid var(--glass-border); 
            color: var(--text-main); 
            padding: 12px; 
            font-size: 1.1em; 
            text-align: center; 
            font-family: 'Share Tech Mono', monospace; 
            margin-bottom: 25px; 
            outline: none; 
            width: 100%; 
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        
        input:focus { 
            border-bottom-color: var(--accent-glow); 
            box-shadow: 0 5px 15px -10px var(--focus-glow);
            background: rgba(211, 47, 47, 0.02);
        }
        
        button { 
            background: transparent; 
            color: var(--accent-red); 
            border: 1px solid var(--accent-red); 
            padding: 14px 20px; 
            cursor: pointer; 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1.1em; 
            transition: all 0.3s ease; 
            width: 100%; 
            font-weight: 600; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        button:hover { 
            background: var(--accent-red); 
            color: #fff; 
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.5); 
        }

        #secure-content { display: none; }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin: 25px 0;
        }
        
        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link { 
            display: block; 
            color: var(--text-main); 
            text-decoration: none; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-left: 3px solid #444;
            padding: 14px 15px; 
            transition: all 0.3s ease; 
            font-weight: 500;
            letter-spacing: 1.5px;
            text-align: left;
            font-size: 1.05em;
        }
        .link:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-left: 3px solid var(--text-main);
            padding-left: 20px;
        }
        .link.rojo { border-left: 3px solid var(--accent-red); }
        .link.rojo:hover { 
            background: rgba(211, 47, 47, 0.1);
            border-left: 3px solid var(--accent-glow); 
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.5);
        }
        
        #error-msg {
            color: var(--accent-glow); 
            font-size: 0.85em; 
            margin-top: 15px;
            height: 15px;
            font-family: 'Share Tech Mono', monospace;
        }
        .success-text {
            color: #4caf50 !important;
        }
    </style>
</head>
<body>

    <div class="exam-box" id="gate-screen">
        <h1>UNKNOWN IDENTITY</h1>
        <p class="subtitle">Knowledge is a privilege.<br>Prove your worth.</p>
        
        <input type="password" id="keyword" placeholder="KEYWORD" autocomplete="off">
        <button onclick="verifyExam()">ENTER</button>
        <p id="error-msg"></p>
    </div>

    <form id="fail-form" action="/verify-exam" method="POST" style="display:none;">
        <input type="hidden" name="p1" value="wrong">
    </form>

    <div class="exam-box" id="secure-content">
        <h1 style="color: var(--text-main);">ACCESS GRANTED</h1>
        <p class="subtitle" style="color: #4caf50;">STATUS: GUEST APPROVED</p>
        
        <div class="divider"></div>
        
        <div class="link-grid">
            <a id="btn-liberte" href="#" class="link rojo">ACCESS LA LIBERTÉ</a>
            <a id="btn-chat" href="#" class="link">ENTER SECURE CHAT</a>
            <a id="btn-unknown" href="#" class="link" style="opacity: 0.6;">UNKNOWN FILES</a>
        </div>
    </div>

    <script>
        document.getElementById("keyword").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                verifyExam();
            }
        });

        async function verifyExam() {
            const keyword = document.getElementById('keyword').value.trim().toLowerCase();
            const errorMsg = document.getElementById('error-msg');

            if (!keyword) return;

            if (keyword === 'traicionar') {
                try {
                    errorMsg.classList.add('success-text');
                    errorMsg.innerText = ">> VERIFYING...";

                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect');

                    if (redirectUrl) {
                        const urlObj = new URL(redirectUrl);
                        urlObj.searchParams.set('u', 'Guest_Approved');
                        urlObj.searchParams.set('p', 'temp');
                        
                        setTimeout(() => {
                            errorMsg.innerText = ">> REDIRECTING TO SECRET LINK...";
                            window.location.href = urlObj.toString();
                        }, 600);
                        return;
                    }

                    const response = await fetch(`/api/status?u=Guest_Approved&p=temp`);
                    const data = await response.json();

                    document.getElementById('gate-screen').style.display = 'none';
                    document.getElementById('secure-content').style.display = 'block';

                    document.getElementById('btn-liberte').href = data.links.liberte;
                    document.getElementById('btn-chat').href = data.links.chat;
                    document.getElementById('btn-unknown').href = data.links.unknown;

                } catch (error) {
                    errorMsg.classList.remove('success-text');
                    errorMsg.innerText = ">> CORE CONNECTION ERROR.";
                }
            } else {
                document.getElementById('fail-form').submit();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ROOT CONTROL | Clau Network</title>
    <style>
        body {
            background: #050000;
            color: #ff0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .panel {
            border: 2px solid #ff0;
            padding: 30px;
            background: rgba(20, 20, 0, 0.8);
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.1);
            width: 90%;
            max-width: 900px;
            margin-top: 20px;
        }

        h1 {
            margin-top: 0;
            border-bottom: 1px dashed #ff0;
            padding-bottom: 15px;
            letter-spacing: 2px;
            text-align: center;
            color: #f00;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            border: 1px solid #550;
            padding: 15px;
            background: #0a0a00;
        }

        .box h3 {
            margin-top: 0;
            color: #fff;
            border-bottom: 1px solid #330;
            padding-bottom: 5px;
        }

        input {
            background: #000;
            border: 1px solid #ff0;
            color: #0f0;
            padding: 5px;
            width: calc(100% - 14px);
            margin-bottom: 10px;
            font-family: inherit;
        }

        button {
            background: #ff0;
            color: #000;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-family: inherit;
            transition: 0.2s;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        button.danger {
            background: #f00;
            color: #fff;
        }

        button.danger:hover {
            background: #ff5555;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #330;
            padding: 5px 0;
        }

        .del-btn {
            background: none;
            border: 1px solid #f00;
            color: #f00;
            padding: 2px 5px;
            width: auto;
            font-size: 0.8em;
        }

        .del-btn:hover {
            background: #f00;
            color: #000;
        }

        .links {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link {
            color: #000;
            background: #ff0;
            text-decoration: none;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="panel">
        <h1>[ ROOT CONTROL - SAO ]</h1>
        <div style="text-align: center; color: #0f0; margin-bottom: 20px;">>> CONEXIÓN DARKVPN ESTABLECIDA <<< /div>

                <div class="grid">
                    <div class="box">
                        <h3>>> ACTIVE USERS</h3>
                        <div id="users-list" style="margin-bottom: 15px; max-height: 150px; overflow-y: auto;">
                            Loading...</div>

                        <input type="text" id="new-user" placeholder="New Agent (Ex: Neo)">
                        <input type="text" id="new-pass" placeholder="Password">
                        <button
                            onclick="sendAction('add_user', document.getElementById('new-user').value, document.getElementById('new-pass').value)">+
                            CREATE CREDENTIAL</button>
                    </div>

                    <div class="box">
                        <h3>>> BLACKLIST (Anti-Intruders)</h3>
                        <div id="ban-list" style="margin-bottom: 15px; max-height: 150px; overflow-y: auto;">Loading...
                        </div>
                    </div>

                    <div class="box">
                        <h3>>> SYSTEM CORE</h3>
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <span>Chat Messages: <span id="chat-count" style="color: #0f0;">0</span></span>
                            <button class="danger" style="width: auto;"
                                onclick="if(confirm('Purge chat server?')) sendAction('clear_chat')">PURGE
                                CHAT</button>
                        </div>
                        <hr style="border: 0; border-top: 1px dashed #330; margin: 15px 0;">
                        <label style="display: block; margin-bottom: 5px;">Change Time (Current: <span
                                id="current-time"></span>)</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="new-time" placeholder="New rule..." style="margin-bottom: 0;">
                            <button style="width: auto;"
                                onclick="sendAction('set_time', null, document.getElementById('new-time').value)">UPDATE</button>
                        </div>
                    </div>

                    <div class="box" style="display: flex; flex-direction: column; justify-content: center;">
                        <h3>>> ROUTING</h3>
                        <div class="box" style="grid-column: 1 / -1;">
                            <h3>>> ARACHNE NETWORK ACTIVITY LOGS</h3>
                            <div id="activity-logs"
                                style="max-height: 250px; overflow-y: auto; background: #000; padding: 10px; border: 1px solid #330; font-size: 0.9em; font-family: 'Share Tech Mono', monospace;">
                                > Waiting for quantum data interception...
                            </div>
                        </div>
                        <div class="links" id="nav-menu" style="margin-top: 10px;">
                            <a id="btn-hub" href="#" class="link">> HUB</a>
                            <a id="btn-chat" href="#" class="link">> CHAT</a>
                            <a id="btn-liberte" href="#" class="link" style="background: #f00; color: #fff;">>
                                LIBERTÉ</a>
                        </div>
                    </div>
                </div>
        </div>

        <script>
            const params = new URLSearchParams(window.location.search);
            const u = params.get('u');
            const p = params.get('p');

            // Cargar enlaces
            fetch(`/api/status?u=${u}&p=${p}`).then(r => r.json()).then(data => {
                document.getElementById('btn-hub').href = data.links.admin.replace('/admin', '/');
                document.getElementById('btn-chat').href = data.links.chat;
                document.getElementById('btn-liberte').href = data.links.liberte;
            });

            // Cargar datos en vivo del servidor
            function loadData() {
                fetch(`/api/admin/data?u=${u}&p=${p}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.error) return alert(data.error);

                        // Renderizar Usuarios
                        let usersHtml = '';
                        for (let user in data.users) {
                            usersHtml += `<div class="list-item">
                        <span><span style="color:#aaa;">USR:</span> ${user} <span style="color:#550;">| PWD: ${data.users[user]}</span></span>
                        ${user !== 'Sao' ? `<button class="del-btn" onclick="sendAction('del_user', '${user}')">X</button>` : '<span style="color:#f00; font-size:0.8em;">[ROOT]</span>'}
                    </div>`;
                        }
                        document.getElementById('users-list').innerHTML = usersHtml;

                        // Renderizar Blacklist
                        let banHtml = '';
                        if (data.blacklist.length === 0) banHtml = '<span style="color:#0f0;">No blocked IPs.</span>';
                        data.blacklist.forEach(ip => {
                            banHtml += `<div class="list-item">
                        <span style="color:#f00;">${ip}</span>
                        <button class="del-btn" onclick="sendAction('unban', '${ip}')">UNBLOCK</button>
                    </div>`;
                        });
                        document.getElementById('ban-list').innerHTML = banHtml;

                        // Renderizar Estado
                        document.getElementById('current-time').innerText = data.hora;
                        document.getElementById('chat-count').innerText = data.chatCount;
                        // Renderizar Logs de Arachne
                        let logsHtml = '';
                        if (data.logs && data.logs.length === 0) logsHtml = '<span style="color:#555;">> No recent network activity.</span>';
                        else if (data.logs) {
                            data.logs.forEach(log => {
                                let colorTipo = log.type === 'ACCESO' ? '#0f0' : '#0ff'; // Verde para accesos, cyan para herramientas
                                logsHtml += `<div style="margin-bottom:6px; border-bottom: 1px solid #110; padding-bottom: 4px;">
                            <span style="color:#888;">[${log.time}]</span> 
                            <span style="color:#ff0; font-weight: bold;">AGENTE ${log.user}</span> 
                            <span style="color:${colorTipo};">[${log.type}]</span> 
                            <span style="color:#ddd;">> ${log.detail}</span>
                        </div>`;
                            });
                        }
                        document.getElementById('activity-logs').innerHTML = logsHtml;
                    });
            }

            // Enviar comandos al backend
            function sendAction(action, target = null, value = null) {
                fetch('/api/admin/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action, target, value, u, p })
                })
                    .then(r => r.json())
                    .then(res => {
                        if (res.success) {
                            if (action === 'add_user') {
                                document.getElementById('new-user').value = '';
                                document.getElementById('new-pass').value = '';
                            }
                            loadData(); // Recargar la pantalla
                        } else {
                            alert('Error ejecutando comando.');
                        }
                    });
            }

            // Iniciar
            loadData();
            // Recargar datos cada 10 segundos para ver si alguien fue baneado en vivo
            setInterval(loadData, 10000); 
        </script>
</body>

</html>xx

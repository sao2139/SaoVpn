<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SECURE CHAT | Clau Network</title>
    <!-- Retro Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --accent-red: #ff3333;
            --accent-dark: #aa0000;
            --text-main: #cccccc;
        }

        body { 
            background: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Share Tech Mono', monospace; 
            padding: 20px; 
            margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            height: 100vh; box-sizing: border-box;
            background-image: linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 100% 4px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-deep); 
            border: 2px solid var(--accent-red); 
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
        }

        .header { 
            border-bottom: 2px dashed var(--accent-red); 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        
        h2 {
            color: var(--accent-red);
            font-size: 1.2em;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 5px var(--accent-red);
        }

        .status { color: var(--accent-dark); font-size: 0.9em; font-weight: bold; }

        #chat-box { 
            flex-grow: 1; 
            padding: 10px; 
            overflow-y: auto; 
            background: #050000; 
            margin-bottom: 15px; 
            border: 1px solid var(--accent-dark);
        }
        
        .msg { margin-bottom: 8px; font-size: 1em; }
        .time { color: #666; font-size: 0.9em; margin-right: 8px;}
        .user { color: var(--accent-red); font-weight: bold; margin-right: 5px; }
        
        form { display: flex; gap: 10px; margin-bottom: 15px; }
        
        input[type="text"] { 
            flex-grow: 1; 
            background: #000; 
            border: 1px solid var(--accent-red); 
            color: #fff; 
            padding: 10px; 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 1em; 
            outline: none; 
        }
        input[type="text"]:focus { 
            background: #110000;
            box-shadow: inset 0 0 10px rgba(255,0,0,0.5); 
        }
        
        button { 
            background: var(--accent-dark); 
            color: #fff; 
            border: 1px solid var(--accent-red); 
            padding: 10px 20px; 
            font-weight: bold; 
            cursor: pointer; 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 1em; 
            text-transform: uppercase;
        }
        button:hover { 
            background: var(--accent-red); 
            color: #000; 
        }
        
        .directory { 
            border-top: 1px dashed var(--accent-dark); 
            padding-top: 15px; 
            display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
        }
        
        .link { 
            color: var(--text-main); 
            text-decoration: none; 
            border: 1px solid #555; 
            padding: 8px 15px; 
            font-size: 0.9em; 
            font-weight: bold;
        }
        .link:hover { 
            background: #222; 
            border-color: var(--text-main);
        }
        .link.rojo { color: var(--accent-red); border-color: var(--accent-dark); }
        .link.rojo:hover { 
            background: var(--accent-dark); 
            color: #fff; 
            border-color: var(--accent-red);
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 1px solid #330000; }
        ::-webkit-scrollbar-thumb { background: var(--accent-dark); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-red); }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h2>ENCRYPTED COMMUNICATION LINK</h2>
            <span class="status">[ SECURE TCP/IP ]</span>
        </div>

        <div id="chat-box">
            {{CHAT_CONTENT}}
        </div>

        <form action="/send-chat" method="POST">
            <input type="hidden" name="u" id="auth-u">
            <input type="hidden" name="p" id="auth-p">
            <input type="text" name="message" placeholder="Type a message on the network..." autocomplete="off" autofocus required>
            <button type="submit">TRANSMIT</button>
        </form>

        <div class="directory" id="nav-menu" style="display:none;">
            <a id="btn-hub" href="#" class="link">RETURN TO HUB</a>
            <a id="btn-liberte" href="#" class="link rojo">LA LIBERTÉ</a>
            <a id="btn-unknown" href="#" class="link" style="opacity: 0.6;">UNKNOWN</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const u = params.get('u') || '';
        const p = params.get('p') || '';
        
        document.getElementById('auth-u').value = u;
        document.getElementById('auth-p').value = p;

        const chatBox = document.getElementById('chat-box');
        chatBox.scrollTop = chatBox.scrollHeight;

        fetch(`/api/status?u=${u}&p=${p}`).then(r => r.json()).then(data => {
            document.getElementById('nav-menu').style.display = 'flex';
            document.getElementById('btn-hub').href = data.links.admin.replace('/admin', '/');
            document.getElementById('btn-liberte').href = data.links.liberte;
            document.getElementById('btn-unknown').href = data.links.unknown;
        }).catch(e => console.log("Signal Lost"));
    </script>
</body>
</html>

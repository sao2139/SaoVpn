<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HUB CENTRAL | Clau Network</title>
    <!-- Elegant Modern Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050507;
            --bg-mid: #0a0a0e;
            --accent-red: #d32f2f;
            --accent-glow: #ff4d4d;
            --text-main: #e0e0e0;
            --text-muted: #888890;
            --glass-bg: rgba(15, 15, 18, 0.75);
            --glass-border: rgba(211, 47, 47, 0.3);
        }

        body { 
            background: radial-gradient(circle at center, var(--bg-mid) 0%, var(--bg-deep) 100%);
            color: var(--text-main); 
            font-family: 'Rajdhani', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; 
            overflow: hidden;
        }

        /* Subtle grid background overlay for cyberpunk feel */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(211, 47, 47, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(211, 47, 47, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .terminal { 
            padding: 40px 50px; 
            text-align: center; 
            width: 400px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); 
            border-top: 2px solid var(--accent-red);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(211, 47, 47, 0.1);
            border-radius: 4px;
            animation: fadeIn 0.8s ease-out;
            transition: opacity 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-main);
            font-size: 1.8em;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .status-locked {
            color: var(--accent-glow);
            text-shadow: 0 0 8px rgba(255, 77, 77, 0.5);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9em;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        input { 
            background: transparent; 
            color: var(--text-main); 
            border: none;
            border-bottom: 1px solid #333; 
            padding: 12px 10px; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center; 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 1.1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-bottom: 1px solid var(--accent-glow);
            background: rgba(211, 47, 47, 0.02);
            box-shadow: 0 5px 15px -10px rgba(255, 77, 77, 0.3);
        }

        input::placeholder {
            color: #444;
            letter-spacing: 1px;
        }

        button { 
            background: transparent; 
            color: var(--accent-red); 
            font-weight: 600; 
            letter-spacing: 2px;
            border: 1px solid var(--accent-red); 
            padding: 14px 20px; 
            cursor: pointer; 
            width: 100%; 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1.1em; 
            text-transform: uppercase;
            transition: all 0.3s ease; 
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        button:hover { 
            background: var(--accent-red); 
            color: #fff; 
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.5); 
        }

        #secure-content { display: none; }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin: 25px 0;
        }

        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link { 
            display: block; 
            color: var(--text-main); 
            text-decoration: none; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-left: 3px solid #444;
            padding: 14px 15px; 
            transition: all 0.3s ease; 
            font-weight: 500;
            letter-spacing: 1.5px;
            text-align: left;
            font-size: 1.05em;
        }

        .link:hover { 
            background: rgba(255, 255, 255, 0.08); 
            border-left: 3px solid var(--text-main);
            padding-left: 20px;
        }

        .link.rojo { 
            border-left: 3px solid var(--accent-red); 
        }
        
        .link.rojo:hover { 
            background: rgba(211, 47, 47, 0.1);
            border-left: 3px solid var(--accent-glow); 
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.5);
        }

        .link.root {
            border-left: 3px solid #fbc02d;
        }

        .link.root:hover {
            background: rgba(251, 192, 45, 0.1);
            border-left: 3px solid #ffeb3b; 
            color: #fff;
        }

        #error {
            color: var(--accent-glow); 
            font-size: 0.85em; 
            margin-top: 15px;
            height: 15px;
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body>

    <div class="terminal" id="login-screen">
        <h1 class="status-locked">NODE LOCKED</h1>
        <p class="subtitle">Identification Required</p>
        
        <div class="input-group">
            <input type="text" id="user" placeholder="AGENT ID" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="pass" placeholder="DECRYPTION KEY">
        </div>
        
        <button onclick="unlockHub()">INITIATE PROTOCOL</button>
        <p id="error"></p>
    </div>

    <div class="terminal" id="secure-content">
        <h1>CLAU NETWORK</h1>
        <p class="subtitle" id="welcome-msg" style="color: #4caf50;">STATUS: ONLINE</p>
        <p class="subtitle" style="font-size: 0.85em; text-transform: none; margin-top: -15px; line-height: 1.4; color: #aaa;">
            Hello user, welcome to the Clau network. Here your identity is encrypted by Post Quantum; no one can enter without my permission. Good luck
        </p>
        
        <div class="divider"></div>
        
        <div class="link-grid">
            <a id="btn-liberte" href="#" class="link rojo">ACCESS LA LIBERTÉ</a>
            <a id="btn-chat" href="#" class="link">ENTER SECURE CHAT</a>
            <a id="btn-unknown" href="#" class="link" style="opacity: 0.6;">UNKNOWN FILES</a>
            <a id="btn-admin" href="#" class="link root" style="display: none;">ROOT CONTROL</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const urlU = params.get('u');
        const urlP = params.get('p');
        if (urlU && urlP) {
            document.getElementById('user').value = urlU;
            document.getElementById('pass').value = urlP;
            setTimeout(unlockHub, 300);
        }

        async function unlockHub() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            const errorMsg = document.getElementById('error');

            if (!u || !p) {
                errorMsg.innerText = ">> MISSING CREDENTIALS.";
                return;
            }

            try {
                const response = await fetch(`/api/status?u=${u}&p=${p}`);
                const data = await response.json();

                const loginScreen = document.getElementById('login-screen');
                const secureContent = document.getElementById('secure-content');
                
                loginScreen.style.opacity = '0';
                
                setTimeout(() => {
                    loginScreen.style.display = 'none';
                    secureContent.style.display = 'block';
                    
                    document.getElementById('welcome-msg').innerText = `AGENT ${u.toUpperCase()} // ACCESS AUTHORIZED`;

                    document.getElementById('btn-liberte').href = data.links.liberte;
                    document.getElementById('btn-chat').href = data.links.chat;
                    document.getElementById('btn-unknown').href = data.links.unknown; 

                    if (u === 'Sao') {
                        const adminBtn = document.getElementById('btn-admin');
                        adminBtn.style.display = 'block';
                        adminBtn.href = data.links.admin;
                    }
                }, 400);

            } catch (error) {
                errorMsg.innerText = ">> CORE CONNECTION ERROR.";
            }
        }

        // Enter to submit
        document.getElementById('pass').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') unlockHub();
        });
    </script>
</body>
</html>
